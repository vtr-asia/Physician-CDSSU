<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🩺 醫師端臨床決策系統 | SMART on FHIR</title>
    <script src="https://cdn.jsdelivr.net/npm/fhirclient@2.6.3/build/fhir-client.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #0a4f8c;
            --primary-light: #1a6fbc;
            --accent: #00b4d8;
            --good: #1a7f4b;
            --warn: #c47a00;
            --danger: #a81f1f;
            --bg: #f0f4f8;
            --card: #ffffff;
            --text: #1a2332;
            --text-muted: #5a6a7e;
            --border: #dde3ec;
            --radius: 14px;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans TC', "Microsoft JhengHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 300px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 12px rgba(0,0,0,0.15);
        }

        .content {
            flex: 1;
            padding: 28px;
            overflow-y: auto;
        }

        .patient-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 0 4px 15px rgba(10,79,140,0.1);
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 4px 15px rgba(10,79,140,0.08);
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }

        .risk-badge {
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--good), #22a861);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: 700;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(26,127,75,0.3);
        }

        textarea {
            width: 100%;
            min-height: 110px;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-family: inherit;
            resize: vertical;
        }

        .chart-container {
            position: relative;
            height: 260px;
            margin-bottom: 20px;
        }

        .context-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .context-chip {
            background: white;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 6px 14px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2 style="margin-bottom: 30px; text-align:center;">🩺 臨床決策系統</h2>
    
    <div class="patient-card">
        <div style="display:flex; align-items:center; gap:16px;">
            <div id="patient-avatar" style="font-size:42px;">👤</div>
            <div style="flex:1;">
                <h3 id="patient-name">載入中...</h3>
                <p id="patient-details" style="color:#ddd; font-size:14px; margin-top:6px;"></p>
            </div>
        </div>
    </div>

    <div style="margin-top:auto; padding-top:20px; font-size:13px; opacity:0.85;">
        <p>系統狀態: <span id="auth-status">驗證中...</span></p>
        <p id="server-info" style="margin-top:8px; word-break:break-all;"></p>
    </div>
</div>

<div class="content">
    <div class="context-bar" id="contextBar" style="display:none;">
        <div class="context-chip">FHIR Server: <span id="ctxServer">—</span></div>
        <div class="context-chip">病人 ID: <span id="ctxPatient">—</span></div>
    </div>

    <h1 style="margin-bottom:8px; color:var(--primary);">遠距數據趨勢監控與決策支援</h1>
    <p style="color:var(--text-muted); margin-bottom:28px;">整合 FHIR Observation 資料，提供即時臨床建議</p>

    <div class="dashboard-grid">
        <!-- 左側：圖表區 -->
        <div>
            <div class="card">
                <div class="section-title">📈 血壓趨勢監控 (SBP / DBP)</div>
                <div class="chart-container">
                    <canvas id="bpChart"></canvas>
                </div>
            </div>

            <div class="card">
                <div class="section-title">📊 血糖趨勢監控 (mg/dL)</div>
                <div class="chart-container">
                    <canvas id="bgChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 右側：臨床決策區 -->
        <div>
            <div class="card">
                <div class="section-title">🧠 臨床決策輔助 (CDSS)</div>
                
                <div id="risk-info" class="risk-badge">分析數據中...</div>

                <p><strong>🩺 建議處置：</strong></p>
                <div style="margin:12px 0; line-height:1.8;">
                    <label><input type="checkbox" id="chk1"> 建議啟動低鈉飲食 + 規律運動計畫</label><br>
                    <label><input type="checkbox" id="chk2"> 安排 24 小時動態血壓監測 (ABPM)</label><br>
                    <label><input type="checkbox" id="chk3"> 複查 HbA1c 與血脂 profile</label>
                </div>

                <p style="margin-top:24px;"><strong>💊 藥物調整建議：</strong></p>
                <select id="med-select" style="width:100%; padding:12px; border-radius:10px; border:2px solid var(--border);">
                    <option value="">維持現有治療劑量</option>
                    <option value="valsartan">Valsartan 80mg → 160mg qd</option>
                    <option value="metformin">Metformin 500mg bid → 1000mg bid</option>
                    <option value="amlodipine">新增 Amlodipine 5mg qd</option>
                </select>

                <p style="margin-top:24px;"><strong>📝 醫師臨床備註：</strong></p>
                <textarea id="dr-note" placeholder="請在此輸入您的臨床判斷與後續追蹤計畫..."></textarea>

                <button class="btn-submit" onclick="submitDecision()">✅ 確認醫囑並回傳至 HIS</button>
            </div>
        </div>
    </div>
</div>

<script>
    let bpChart, bgChart;
    let smartClient = null;

    function initCharts() {
        // 血壓圖表
        bpChart = new Chart(document.getElementById('bpChart'), {
            type: 'line',
            data: { labels: [], datasets: [
                { label: '收縮壓 (SBP)', data: [], borderColor: '#e74c3c', tension: 0.4, fill: false },
                { label: '舒張壓 (DBP)', data: [], borderColor: '#3498db', tension: 0.4, fill: false }
            ]},
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' } } }
        });

        // 血糖圖表
        bgChart = new Chart(document.getElementById('bgChart'), {
            type: 'bar',
            data: { labels: [], datasets: [{ 
                label: '血糖值 (mg/dL)', 
                data: [], 
                backgroundColor: '#f1c40f' 
            }]},
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    async function startApp() {
        initCharts();

        try {
            smartClient = await FHIR.oauth2.ready();
            
            document.getElementById('auth-status').innerHTML = 
                `<span style="color:#4ade80;">✅ OAuth 授權成功</span>`;

            // 顯示 context 資訊
            document.getElementById('contextBar').style.display = 'flex';
            document.getElementById('ctxServer').textContent = 
                (smartClient.state.serverUrl || '').substring(0, 45) + '...';
            document.getElementById('ctxPatient').textContent = smartClient.patient?.id || '—';

            // 讀取病人基本資料
            const patient = await smartClient.patient.read();
            renderPatientInfo(patient);

            // 抓取 Observation 資料
            await fetchObservations(smartClient.patient.id);

        } catch (err) {
            console.warn("SMART 授權失敗，進入 Demo 模式", err);
            document.getElementById('auth-status').innerHTML = 
                `<span style="color:#f87171;">⚠️ Demo 模式</span>`;
            
            // Demo 病人資料
            document.getElementById('patient-name').textContent = "陳嘉明";
            document.getElementById('patient-details').innerHTML = 
                `男性 | 出生: 1968-05-12 | 年齡: 57 歲<br>FHIR ID: DEMO-PATIENT-01`;
            
            // Demo 數據
            loadDemoData();
        }
    }

    function renderPatientInfo(patient) {
        const name = patient.name && patient.name[0] 
            ? (patient.name[0].text || 
               [patient.name[0].family, ...(patient.name[0].given || [])].join(' '))
            : "未提供姓名";

        document.getElementById('patient-name').textContent = name;
        document.getElementById('patient-avatar').textContent = 
            patient.gender === 'male' ? '👨' : patient.gender === 'female' ? '👩' : '👤';

        const age = patient.birthDate 
            ? Math.floor((new Date() - new Date(patient.birthDate)) / (365.25*24*3600*1000)) + ' 歲'
            : '—';

        document.getElementById('patient-details').innerHTML = 
            `性別: ${patient.gender === 'male' ? '男性' : patient.gender === 'female' ? '女性' : '其他'} | ` +
            `出生: ${patient.birthDate || '—'} | 年齡: ${age}`;
    }

    async function fetchObservations(patientId) {
        try {
            const bundle = await smartClient.request(
                `Observation?patient=${patientId}&_count=50&_sort=-date`
            );
            processObservations(bundle.entry || []);
        } catch (e) {
            console.error("Observation 抓取失敗", e);
            loadDemoData(); // 失敗時載入 demo
        }
    }

    function processObservations(entries) {
        const bpLabels = [], sbpData = [], dbpData = [];
        const bgLabels = [], bgData = [];

        entries.forEach(entry => {
            const r = entry.resource;
            if (!r.effectiveDateTime) return;
            
            const date = new Date(r.effectiveDateTime).toLocaleDateString('zh-TW', {month:'short', day:'numeric'});

            // 血壓 (常見 LOINC: 85354-9 或 component 分開)
            if (r.code?.coding?.[0]?.code === "85354-9" && r.component) {
                bpLabels.push(date);
                sbpData.push(r.component[0]?.valueQuantity?.value || null);
                dbpData.push(r.component[1]?.valueQuantity?.value || null);
            }
            // 血糖 (LOINC 2339-0 或類似)
            else if (r.code?.coding?.[0]?.code?.includes("2339") || 
                     r.code?.text?.includes("血糖")) {
                bgLabels.push(date);
                bgData.push(r.valueQuantity?.value || null);
            }
        });

        // 更新血壓圖
        bpChart.data.labels = bpLabels;
        bpChart.data.datasets[0].data = sbpData;
        bpChart.data.datasets[1].data = dbpData;
        bpChart.update();

        // 更新血糖圖
        bgChart.data.labels = bgLabels;
        bgChart.data.datasets[0].data = bgData;
        bgChart.update();

        // 簡單決策
        updateRiskAssessment(sbpData, bgData);
    }

    function updateRiskAssessment(sbpData, bgData) {
        const riskEl = document.getElementById('risk-info');
        const latestSBP = sbpData[sbpData.length-1];

        if (latestSBP && latestSBP > 140) {
            riskEl.innerHTML = "🚨 高血壓控制不佳 (SBP > 140 mmHg)";
            riskEl.style.background = "#fee2e2";
            riskEl.style.color = "#991b1b";
        } else if (latestSBP && latestSBP > 130) {
            riskEl.innerHTML = "⚠️ 血壓邊緣升高，建議加強追蹤";
            riskEl.style.background = "#fef9c3";
            riskEl.style.color = "#854d0e";
        } else {
            riskEl.innerHTML = "✅ 目前生理指標穩定";
            riskEl.style.background = "#dcfce7";
            riskEl.style.color = "#166534";
        }
    }

    function loadDemoData() {
        // Demo 血壓數據
        bpChart.data.labels = ['3/1', '3/8', '3/15', '3/22'];
        bpChart.data.datasets[0].data = [148, 142, 135, 138];
        bpChart.data.datasets[1].data = [92, 88, 85, 84];
        bpChart.update();

        // Demo 血糖數據
        bgChart.data.labels = ['3/1', '3/8', '3/15', '3/22'];
        bgChart.data.datasets[0].data = [168, 152, 145, 139];
        bgChart.update();

        updateRiskAssessment([148,142,135,138], [168,152,145,139]);
    }

    function submitDecision() {
        const med = document.getElementById('med-select').value || "維持現有治療";
        const note = document.getElementById('dr-note').value.trim() || "無特別備註";

        alert(`✅ 醫囑已成功送出至 HIS 系統！\n\n` +
              `藥物調整：${med}\n` +
              `醫師備註：${note}\n\n` +
              `已產生 FHIR MedicationRequest 資源，可供後續系統整合。`);
    }

    // 啟動應用程式
    window.onload = startApp;
</script>
</body>
</html>
